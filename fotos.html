<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EDICIONES ANTERIORES · FINKAFEST</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Archivo fotográfico · Finkafest Vol I · II · III" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    .foto-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 900px) { .foto-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 580px) { .foto-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 380px) {
      .foto-grid { grid-template-columns: 1fr; }
      .foto-card { transform: none !important; }
      .foto-card--wide { grid-column: span 1; }
    }

    .foto-card {
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      cursor: pointer;
      overflow: visible;
      background: var(--ink);
      position: relative;
      transition: box-shadow 0.12s;
    }
    .foto-card:hover {
      transform: scale(1.06) rotate(0deg) !important;
      box-shadow: 8px 8px 0 var(--green);
      z-index: 10;
    }
    .foto-card--wide { grid-column: span 2; }

    .foto-card img {
      display: block;
      width: 100%;
      height: 170px;
      object-fit: cover;
    }
    .foto-card--wide img { height: 200px; }

    /* Divisor entre ediciones */
    .vol-divider {
      border: none;
      border-top: 3px solid #000;
      margin: 0;
    }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 60px 80px;
    }
    #lightbox.open { display: flex; }

    #lb-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border: 3px solid var(--green);
      box-shadow: 10px 10px 0 var(--green);
      display: block;
    }

    .lb-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--red);
      color: var(--ink);
      border: 3px solid #000;
      padding: 10px 16px;
      font-family: var(--sub);
      font-size: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
      line-height: 1;
    }
    .lb-close:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 #000; }

    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #000;
      color: var(--green);
      border: 3px solid var(--green);
      padding: 14px 18px;
      font-family: var(--display);
      font-size: 26px;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--green);
      line-height: 1;
    }
    .lb-nav:hover { background: var(--green); color: #000; box-shadow: 6px 6px 0 var(--green); }
    #lb-prev { left: 16px; }
    #lb-next { right: 16px; }

    #lb-counter {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--body);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    @media (max-width: 640px) {
      #lightbox { padding: 50px 54px; }
      #lb-prev { left: 8px; padding: 10px 12px; font-size: 20px; }
      #lb-next { right: 8px; padding: 10px 12px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <div id="app">

    <!-- Header -->
    <section style="padding-top:50px; padding-bottom:10px;">
      <div class="container">
        <a href="index.html" class="btn" style="background:var(--green);color:#000;border-color:#000;outline-color:var(--green);font-size:13px;padding:12px 20px;margin-bottom:28px;display:inline-flex;text-decoration:none;">
          ← VOLVER A FINKAFEST
        </a>

        <div style="display:block;width:fit-content;background:#000;color:var(--green);padding:6px 12px;border:2px solid var(--green);margin-bottom:26px;">
          <span class="mono" style="font-size:12px;letter-spacing:0.22em;font-weight:700;text-transform:uppercase;">
            X · FINKAFEST · ARCHIVO FOTOGRÁFICO · X
          </span>
        </div>

        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:16px;">
          <div class="display" style="font-size:clamp(36px,8vw,100px);background:#000;color:var(--green);padding:0 18px 8px;line-height:0.95;border:4px solid #000;box-shadow:8px 8px 0 #000;">
            EDICIONES ANTERIORES
          </div>
          <div class="display" style="font-size:clamp(36px,8vw,100px);background:var(--green);color:#000;padding:0 18px 8px;line-height:0.95;border:4px solid #000;box-shadow:8px 8px 0 #000;margin-left:4vw;">
            FINKAFEST
          </div>
        </div>
      </div>
    </section>

    <div id="editions"></div>

  </div>

  <!-- Lightbox -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada">
    <button class="lb-close" id="lb-close-btn" aria-label="Cerrar">✕ CERRAR</button>
    <button class="lb-nav" id="lb-prev" aria-label="Anterior">←</button>
    <img id="lb-img" src="" alt="Foto ampliada" />
    <button class="lb-nav" id="lb-next" aria-label="Siguiente">→</button>
    <span id="lb-counter"></span>
  </div>

  <script>
    const EDITIONS = [
      {
        vol: "VOL III",
        photos: [
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.31.35%20%281%29.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.31.35.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.31.36.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.31.37.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.31.39%20%281%29.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.31.39.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.31.40.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.31.41.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.31.42.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.31.58.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.31.59.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.32.00.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.32.20.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.32.24%20%281%29.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.32.24%20%282%29.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.32.24.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.32.27%20%281%29.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.32.27.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.32.28.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.32.29.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.32.31.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.33.34%20%281%29.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.33.34.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.33.35%20%281%29.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.33.35.jpeg",
          "fotosfinka/finkafest3/WhatsApp%20Image%202026-05-23%20at%2011.33.36.jpeg",
        ]
      },
      {
        vol: "VOL II",
        photos: [
          "fotosfinka/finkafest2/01fd1a87-931e-4a11-a87f-ea245e657119.jpg",
          "fotosfinka/finkafest2/07ce5951-623c-4af3-b45b-a8f002667d54.jpg",
          "fotosfinka/finkafest2/1a222d44-62b2-4433-96d0-a6d580d4ae34.jpg",
          "fotosfinka/finkafest2/35499dd5-822f-4b55-93a7-3e4dab797b82.jpg",
          "fotosfinka/finkafest2/6c40894d-dd73-43f4-bedf-94686df2e139.jpg",
          "fotosfinka/finkafest2/72c4787b-d282-43d1-b948-e4031454cf04.jpg",
          "fotosfinka/finkafest2/7f35562e-28d7-4741-877b-9846fe2e5190.jpg",
          "fotosfinka/finkafest2/9c78a69b-4927-4f7c-ba6c-f98cc688d4e7.jpg",
          "fotosfinka/finkafest2/CCBA1247.JPG",
          "fotosfinka/finkafest2/IMG_7822.jpeg",
          "fotosfinka/finkafest2/IMG_7827.jpeg",
          "fotosfinka/finkafest2/IMG_7834.jpeg",
          "fotosfinka/finkafest2/cb7c1fea-60ee-4f5b-9996-139791363293.jpg",
          "fotosfinka/finkafest2/cf45f714-9baf-4804-bae6-c7f6a0635702.jpg",
          "fotosfinka/finkafest2/d77cad5c-580b-4160-95f6-eb486dc5e223.jpg",
          "fotosfinka/finkafest2/dceb1311-3f12-4c5c-ac43-860ec9b9d0ef.jpg",
          "fotosfinka/finkafest2/eb93248c-dc1d-4647-8903-78be912e9444.jpg",
          "fotosfinka/finkafest2/f486cbc5-2fde-4be7-8698-125c1a7e8cfe.jpg",
          "fotosfinka/finkafest2/f711c659-7907-4350-9926-986e3ed211fe.jpg",
          "fotosfinka/finkafest2/fb244c3c-34ac-4dd8-b6d2-baf66639fc40.jpg",
        ]
      },
      {
        vol: "VOL I",
        photos: [
          "fotosfinka/finkafest1/29274f10-fe2e-44ce-a81f-078e304e489c.jpg",
          "fotosfinka/finkafest1/3dc6b673-68d1-4824-8168-21a2a394d783.jpg",
          "fotosfinka/finkafest1/8413f60f-e564-4948-b8cf-b8a25f303673.jpg",
          "fotosfinka/finkafest1/IMG_9899.jpeg",
          "fotosfinka/finkafest1/IMG_9910.jpeg",
          "fotosfinka/finkafest1/IMG_9915.jpeg",
          "fotosfinka/finkafest1/ba45708b-9432-4824-abff-46913f778b12.jpg",
          "fotosfinka/finkafest1/d24286b4-69b7-4c1c-a407-fc64983b1712.jpg",
        ]
      }
    ];

    const ROTS  = [-2.5, 1.2, -0.8, 2.1, -1.5, 0.9, -2.0, 1.7, -1.1, 2.4, -0.6, 1.8, -1.9, 0.7, -2.3];
    const WIDE_SLOTS = new Set([2, 6, 11, 16]);

    let allPhotos = [];
    let currentIdx = 0;

    const editionsEl = document.getElementById("editions");

    EDITIONS.forEach((ed, ei) => {
      if (ei > 0) {
        const hr = document.createElement("hr");
        hr.className = "vol-divider";
        editionsEl.appendChild(hr);
      }

      const section = document.createElement("section");
      section.style.cssText = "padding-top:48px;padding-bottom:56px;";

      const cont = document.createElement("div");
      cont.className = "container";

      // Título de edición
      const header = document.createElement("div");
      header.style.cssText = "display:flex;align-items:baseline;gap:18px;margin-bottom:26px;flex-wrap:wrap;";
      header.innerHTML = `
        <div class="display" style="font-size:clamp(40px,8vw,96px);background:var(--red);color:var(--ink);padding:2px 16px 8px;border:3px solid #000;box-shadow:6px 6px 0 #000;line-height:0.88;">${ed.vol}</div>
      `;
      cont.appendChild(header);

      const grid = document.createElement("div");
      grid.className = "foto-grid";

      ed.photos.forEach((src, i) => {
        const globalIdx = allPhotos.length;
        allPhotos.push(src);

        const isWide = WIDE_SLOTS.has(i % 20);
        const rot    = ROTS[i % ROTS.length];

        const card = document.createElement("div");
        card.className = isWide ? "foto-card foto-card--wide" : "foto-card";
        card.style.transform = `rotate(${rot}deg)`;
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", `Ver foto ${i + 1} de ${ed.vol}`);

        card.addEventListener("click", () => openLb(globalIdx));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLb(globalIdx); }
        });

        const img = document.createElement("img");
        img.src = src;
        img.alt = "";
        img.loading = "lazy";
        img.decoding = "async";

        card.appendChild(img);
        grid.appendChild(card);
      });

      cont.appendChild(grid);
      section.appendChild(cont);
      editionsEl.appendChild(section);
    });

    // ── Lightbox ─────────────────────────────────────────
    const lb      = document.getElementById("lightbox");
    const lbImg   = document.getElementById("lb-img");
    const lbCount = document.getElementById("lb-counter");

    function openLb(idx) {
      currentIdx = idx;
      lbImg.src = allPhotos[idx];
      lbCount.textContent = `${idx + 1} / ${allPhotos.length}`;
      lb.classList.add("open");
      document.body.style.overflow = "hidden";
      document.getElementById("lb-close-btn").focus();
    }

    function closeLb() {
      lb.classList.remove("open");
      document.body.style.overflow = "";
    }

    function navLb(dir) {
      currentIdx = (currentIdx + dir + allPhotos.length) % allPhotos.length;
      lbImg.src = allPhotos[currentIdx];
      lbCount.textContent = `${currentIdx + 1} / ${allPhotos.length}`;
    }

    document.getElementById("lb-close-btn").addEventListener("click", closeLb);
    document.getElementById("lb-prev").addEventListener("click", () => navLb(-1));
    document.getElementById("lb-next").addEventListener("click", () => navLb(1));

    lb.addEventListener("click", (e) => { if (e.target === lb) closeLb(); });

    document.addEventListener("keydown", (e) => {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape")     closeLb();
      if (e.key === "ArrowLeft")  navLb(-1);
      if (e.key === "ArrowRight") navLb(1);
    });
  </script>
</body>
</html>
