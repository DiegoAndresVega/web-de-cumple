<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>LA FINKA · GRANJA</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --cielo: #8fd3f4;
      --panel: #4a3322;
      --panel-borde: #2b1c12;
      --panel-texto: #f4ecd8;
      --acento: #cbdf5a;
      --rojo: #d6453c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: var(--cielo); color: var(--panel-texto);
      font-family: "Space Mono", monospace;
    }
    #juego { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
    #juego.arrastrando { cursor: grabbing; }

    .panel {
      position: absolute; background: var(--panel); border: 3px solid var(--panel-borde);
      box-shadow: 4px 4px 0 rgba(0,0,0,.35); padding: 10px 14px; font-size: 12px; line-height: 1.6;
    }

    #titulo { top: 14px; left: 14px; font-family: "Press Start 2P", monospace; font-size: 13px; color: var(--acento); letter-spacing: 1px; }
    #titulo .sub { display: block; font-family: "Space Mono", monospace; font-size: 9px; color: var(--panel-texto); margin-top: 6px; letter-spacing: 2px; }
    #titulo a { color: var(--panel-texto); text-decoration: none; border-bottom: 1px dashed var(--panel-texto); }
    #titulo a:hover { color: var(--acento); border-color: var(--acento); }

    #controles { top: 14px; right: 14px; max-width: 200px; font-size: 11px; }
    #controles b { color: var(--acento); }

    #editor-toggle {
      position: absolute; bottom: 14px; right: 14px; cursor: pointer; user-select: none;
      font-family: "Press Start 2P", monospace; font-size: 11px; color: var(--panel-texto);
    }
    #editor-toggle:hover, #editor-toggle.activo { background: #6b4a31; color: var(--acento); }

    #editor-panel { bottom: 14px; left: 14px; right: 160px; display: none; max-height: 40vh; overflow: auto; }
    #editor-panel.activo { display: block; }
    #editor-panel h3 { margin: 0 0 6px; font-size: 11px; color: var(--acento); letter-spacing: 1px; }
    #editor-panel .fila { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
    #editor-panel button {
      background: #6b4a31; border: 2px solid var(--panel-borde); color: var(--panel-texto);
      font-family: inherit; font-size: 11px; padding: 5px 8px; cursor: pointer; white-space: nowrap;
    }
    #editor-panel button:hover { background: #84603f; }
    #editor-panel button.activo { background: var(--acento); color: #2b1c12; border-color: #2b1c12; }
    #editor-panel button.peligro { background: var(--rojo); }
    #editor-panel textarea {
      width: 100%; height: 70px; background: #2a1c14; color: var(--acento);
      border: 2px solid var(--panel-borde); font-family: monospace; font-size: 10px; padding: 6px;
      resize: vertical;
    }

    #estado { bottom: 14px; left: 14px; font-size: 11px; }
  </style>
</head>
<body>
  <canvas id="juego"></canvas>

  <div class="panel" id="titulo">
    LA FINKA
    <span class="sub"><a href="index.html">← FINKAFEST</a> · GRANJA</span>
  </div>

  <div class="panel" id="controles">
    <b>WASD</b> / flechas — mover<br/>
    <b>Rueda</b> — zoom<br/>
    <b>Tab</b> — cámara libre / seguir<br/>
    <b>E</b> — modo editor
  </div>

  <div class="panel" id="estado">Cargando La Finka…</div>

  <div class="panel" id="editor-toggle">✎ EDITOR</div>

  <div class="panel" id="editor-panel">
    <h3>TERRENO</h3>
    <div class="fila" id="pinceles-terreno"></div>
    <h3>OBJETOS</h3>
    <div class="fila" id="pinceles-objetos"></div>
    <div class="fila">
      <button id="btn-mover">↔ MOVER / SELECCIONAR</button>
      <button id="btn-borrar" class="peligro">🗑 BORRAR</button>
      <span style="flex:1"></span>
      <button id="btn-exportar">⇩ EXPORTAR JSON</button>
      <button id="btn-importar">⇧ IMPORTAR JSON</button>
      <button id="btn-reset" class="peligro">↺ RESET MAPA</button>
    </div>
    <textarea id="editor-json" placeholder="JSON del mapa (objetos + terreno)…"></textarea>
  </div>

  <script>
    window.addEventListener("error", (e) => {
      const el = document.getElementById("estado");
      if (el) {
        el.textContent = "ERROR: " + e.message + " (" + (e.filename || "").split("/").pop() + ":" + e.lineno + ")";
        el.style.background = "#8e2c2c";
      }
    });
  </script>
  <script src="finkafarm-datos.js"></script>
  <script src="finkafarm-sprites.js"></script>
  <script src="finkafarm-juego.js"></script>
</body>
</html>
